name: Restaurer l'API live

on:
  workflow_dispatch:
    inputs:
      release:
        description: SHA Git complet de la release à restaurer
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: api-refs/heads/live
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: live
      url: https://api.septentrional.tg/api/v2/health
    env:
      DEPLOY_HOST: hathor.o2switch.net
      DEPLOY_PORT: "22"
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_BASE_PATH: /home/${{ vars.DEPLOY_USER }}/apps/septentrional-api
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
      RELEASE: ${{ inputs.release }}

    steps:
      - name: Valider les paramètres
        run: |
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || exit 1
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$DEPLOY_BASE_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          [[ "$PHP_BIN" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1

      - name: Autoriser temporairement le runner chez o2switch
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$CPANEL_API_TOKEN" || exit 1
          runner_ip="$(curl -4fsS --max-time 20 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || exit 1
          printf 'RUNNER_IP=%s\n' "$runner_ip" >> "$GITHUB_ENV"
          response="$(curl -fsS --max-time 50 \
            -H "Authorization: cpanel $DEPLOY_USER:$CPANEL_API_TOKEN" \
            "https://$DEPLOY_HOST:2083/execute/SshWhitelist/add?address=$runner_ip&port=$DEPLOY_PORT")"
          jq -e '.status == 1' <<< "$response" >/dev/null

      - name: Configurer la clé SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || exit 1
          test -n "$DEPLOY_SSH_KNOWN_HOSTS" || exit 1
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Restaurer la release demandée
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$DEPLOY_BASE_PATH" "$RELEASE" "$PHP_BIN" <<'REMOTE'
          set -Eeuo pipefail
          base="$1"
          release="$base/releases/$2"
          php_bin="$3"
          test -f "$release/artisan"
          ln -sfn "$release" "$base/current.next"
          mv -Tf "$base/current.next" "$base/current"
          cd "$release"
          "$php_bin" artisan up || true
          "$php_bin" artisan queue:restart || true
          REMOTE

      - name: Vérifier l'API restaurée
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            https://api.septentrional.tg/api/v2/health

      - name: Retirer l'autorisation SSH temporaire
        if: ${{ always() && env.RUNNER_IP != '' }}
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          for direction in in out; do
            curl -fsS --max-time 50 \
              -H "Authorization: cpanel $DEPLOY_USER:$CPANEL_API_TOKEN" \
              "https://$DEPLOY_HOST:2083/execute/SshWhitelist/remove?address=$RUNNER_IP&port=$DEPLOY_PORT&direction=$direction" || true
          done
