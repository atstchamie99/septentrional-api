name: Vérification Backend Septentrional

on:
  push:
    branches:
      - dev
      - production

  pull_request:
    branches:
      - production

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Vérifier Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none

      - name: Vérifier les versions
        run: |
          php -v
          composer --version

      - name: Installer les dépendances
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Créer un environnement de test
        run: |
          cat > .env <<EOF
          APP_NAME="Septentrional API"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          LOG_CHANNEL=stack
          LOG_LEVEL=debug

          DB_CONNECTION=sqlite
          DB_DATABASE=database/database.sqlite

          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync

          FILESYSTEM_DISK=local

          MAIL_MAILER=array
          BROADCAST_CONNECTION=log
          EOF

      - name: Préparer SQLite
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Générer la clé Laravel
        run: php artisan key:generate --force

      - name: Nettoyer les caches
        run: php artisan optimize:clear

      - name: Vérifier Laravel
        run: php artisan about

      - name: Exécuter les migrations
        run: php artisan migrate --force

      - name: Vérifier les routes
        run: php artisan route:list

      - name: Vérifier la configuration
        run: php artisan config:cache

      - name: Exécuter les tests
        run: php artisan test
