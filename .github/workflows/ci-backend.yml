name: Tester et publier l'API live

on:
  push:
    branches: [dev, live]
  pull_request:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  laravel:
    name: Tests Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Créer l'environnement de test
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=testing/' \
            -e 's/^APP_DEBUG=.*/APP_DEBUG=true/' \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' \
            -e 's/^CACHE_STORE=.*/CACHE_STORE=array/' \
            -e 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' \
            -e 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' \
            -e 's/^MAIL_MAILER=.*/MAIL_MAILER=array/' \
            .env
          php artisan key:generate --force

      - name: Vérifier la configuration et les migrations
        run: |
          composer validate --strict --no-check-publish
          composer check:env-example
          php artisan migrate --force
          php artisan route:list

      - name: Exécuter les tests
        run: php artisan test

      - name: Construire le paquet live
        if: github.ref == 'refs/heads/live' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
          rm -f bootstrap/cache/*.php
          tar --exclude=public/storage --exclude=public/hot \
            --exclude='database/*.sqlite*' --exclude=storage/logs \
            --exclude=storage/framework --exclude=.env \
            -czf "$RUNNER_TEMP/release.tar.gz" \
            app bootstrap config database lang public resources routes vendor \
            artisan composer.json composer.lock
          cp scripts/deploy/server.sh scripts/deploy/backup-database.php "$RUNNER_TEMP/"

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/live' && github.event_name != 'pull_request'
        with:
          name: api-live-release
          path: |
            ${{ runner.temp }}/release.tar.gz
            ${{ runner.temp }}/server.sh
            ${{ runner.temp }}/backup-database.php
          retention-days: 7

  publish:
    name: Publier le paquet valide
    needs: laravel
    if: github.ref == 'refs/heads/live' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-live-release
          path: release
      - uses: actions/checkout@v4
        with:
          ref: live
          path: source
      - name: Publier la branche technique live-build
        run: |
          set -euo pipefail
          cd source
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 0
          git switch --orphan live-build
          cp ../release/release.tar.gz ../release/server.sh ../release/backup-database.php .
          printf '%s\n' "$GITHUB_SHA" > revision
          sha256sum release.tar.gz > SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release.tar.gz server.sh backup-database.php revision SHA256SUMS
          git commit -m "Tested API live release $GITHUB_SHA"
          git push --force origin HEAD:live-build
