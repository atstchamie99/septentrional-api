name: Vérifier et déployer l'API

on:
  push:
    branches: [dev, live]
  pull_request:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/live' }}

jobs:
  laravel:
    name: Vérifier Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Créer l'environnement de test
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=testing/' \
            -e 's/^APP_DEBUG=.*/APP_DEBUG=true/' \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' \
            -e 's/^CACHE_STORE=.*/CACHE_STORE=array/' \
            -e 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' \
            -e 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' \
            -e 's/^MAIL_MAILER=.*/MAIL_MAILER=array/' \
            .env
          php artisan key:generate --force

      - name: Vérifier la configuration et les migrations
        run: |
          composer validate --strict --no-check-publish
          composer check:env-example
          php artisan migrate --force
          php artisan route:list

      - name: Exécuter les tests
        run: php artisan test

  deploy:
    name: Déployer l'API live
    if: github.event_name == 'push' && github.ref == 'refs/heads/live'
    needs: laravel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: live
      url: https://api.septentrional.tg/api/v2/health
    env:
      DEPLOY_HOST: hathor.o2switch.net
      DEPLOY_PORT: "22"
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_BASE_PATH: /home/${{ vars.DEPLOY_USER }}/apps/septentrional-api
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
      COMPOSER_BIN: ${{ vars.COMPOSER_BIN || 'composer' }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la configuration de déploiement
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || exit 1
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$DEPLOY_BASE_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          [[ "$PHP_BIN" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          [[ "$COMPOSER_BIN" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1

      - name: Autoriser temporairement le runner chez o2switch
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$CPANEL_API_TOKEN" || {
            echo "Le secret CPANEL_API_TOKEN est absent de l'environnement GitHub live."
            exit 1
          }
          runner_ip="$(curl -4fsS --max-time 20 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || exit 1
          printf 'RUNNER_IP=%s\n' "$runner_ip" >> "$GITHUB_ENV"
          response="$(curl -fsS --max-time 50 \
            -H "Authorization: cpanel $DEPLOY_USER:$CPANEL_API_TOKEN" \
            "https://$DEPLOY_HOST:2083/execute/SshWhitelist/add?address=$runner_ip&port=$DEPLOY_PORT")"
          jq -e '.status == 1' <<< "$response" >/dev/null

      - name: Configurer la clé SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || exit 1
          test -n "$DEPLOY_SSH_KNOWN_HOSTS" || exit 1
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Lire la release active
        id: release
        run: |
          previous="$({
            ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
              "$DEPLOY_BASE_PATH" <<'REMOTE'
          base="$1"
          if [[ -L "$base/current" ]]; then
            readlink -f "$base/current"
          fi
          REMOTE
          } 2>/dev/null)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Préparer la release distante
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$DEPLOY_BASE_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          base="$1"
          release="$base/releases/$2"
          mkdir -p "$release" \
            "$base/shared/storage/app/public" \
            "$base/shared/storage/framework/cache/data" \
            "$base/shared/storage/framework/sessions" \
            "$base/shared/storage/framework/views" \
            "$base/shared/storage/logs"
          test -f "$base/shared/.env" || {
            echo "Fichier absent: $base/shared/.env" >&2
            exit 1
          }
          REMOTE

      - name: Envoyer le code de l'API
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='tests/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='public/storage' \
            -e "ssh -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes" \
            ./ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE_PATH/releases/$GITHUB_SHA/"

      - name: Installer et activer la release
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$DEPLOY_BASE_PATH" "$GITHUB_SHA" "$PHP_BIN" "$COMPOSER_BIN" <<'REMOTE'
          set -Eeuo pipefail
          base="$1"
          release="$base/releases/$2"
          php_bin="$3"
          composer_bin="$4"
          previous=""

          if [[ -L "$base/current" ]]; then
            previous="$(readlink -f "$base/current")"
          fi

          restore_previous() {
            if [[ -n "$previous" && -d "$previous" ]]; then
              ln -sfn "$previous" "$base/current.next"
              mv -Tf "$base/current.next" "$base/current"
              cd "$previous"
              "$php_bin" artisan up || true
            fi
          }

          trap 'status=$?; if [[ $status -ne 0 ]]; then restore_previous; fi; exit $status' EXIT

          if [[ -n "$previous" && -f "$previous/artisan" ]]; then
            cd "$previous"
            "$php_bin" artisan down --retry=60 || true
          fi

          ln -sfn "$base/shared/.env" "$release/.env"
          ln -sfn "$base/shared/storage" "$release/storage"
          chmod -R u+rwX "$base/shared/storage" "$release/bootstrap/cache"

          cd "$release"
          "$composer_bin" install \
            --no-dev --prefer-dist --no-interaction --no-progress \
            --optimize-autoloader
          "$php_bin" artisan optimize:clear
          "$php_bin" artisan migrate --force
          "$php_bin" artisan storage:link || true
          "$php_bin" artisan config:cache
          "$php_bin" artisan view:cache

          ln -sfn "$release" "$base/current.next"
          mv -Tf "$base/current.next" "$base/current"

          "$php_bin" artisan queue:restart || true
          "$php_bin" artisan up
          trap - EXIT
          REMOTE

      - name: Vérifier l'API
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            https://api.septentrional.tg/api/v2/health

      - name: Restaurer le code précédent en cas d'échec
        if: ${{ failure() && steps.release.outputs.previous != '' }}
        env:
          PREVIOUS_RELEASE: ${{ steps.release.outputs.previous }}
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$DEPLOY_BASE_PATH" "$PREVIOUS_RELEASE" "$PHP_BIN" <<'REMOTE'
          set -Eeuo pipefail
          base="$1"
          previous="$2"
          php_bin="$3"
          case "$previous" in
            "$base"/releases/*) ;;
            *) exit 1 ;;
          esac
          test -f "$previous/artisan"
          ln -sfn "$previous" "$base/current.next"
          mv -Tf "$base/current.next" "$base/current"
          cd "$previous"
          "$php_bin" artisan up || true
          REMOTE

      - name: Retirer l'autorisation SSH temporaire
        if: ${{ always() && env.RUNNER_IP != '' }}
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          for direction in in out; do
            curl -fsS --max-time 50 \
              -H "Authorization: cpanel $DEPLOY_USER:$CPANEL_API_TOKEN" \
              "https://$DEPLOY_HOST:2083/execute/SshWhitelist/remove?address=$RUNNER_IP&port=$DEPLOY_PORT&direction=$direction" || true
          done
