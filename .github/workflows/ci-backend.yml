name: Vérifier l'API

on:
  push:
    branches: [dev, live]
  pull_request:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Tests Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Créer l'environnement de test
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=testing/' \
            -e 's/^APP_DEBUG=.*/APP_DEBUG=true/' \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' \
            -e 's/^CACHE_STORE=.*/CACHE_STORE=array/' \
            -e 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' \
            -e 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' \
            -e 's/^MAIL_MAILER=.*/MAIL_MAILER=array/' \
            .env
          php artisan key:generate --force

      - name: Vérifier la configuration et les migrations
        run: |
          composer validate --strict --no-check-publish
          composer check:env-example
          php artisan migrate --force
          php artisan route:list

      - name: Exécuter les tests
        run: php artisan test
